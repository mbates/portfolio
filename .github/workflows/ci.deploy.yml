name: BatesPortfolio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
      - name: Run build and tests for PRs
        run: |
          npm ci
          npm run test:run
          npm run build
  deployment:
    if: ${{ github.actor != 'dependabot[bot]' && github.event_name == 'push' }}
    name: Deploy to S3
    needs: [build]
    runs-on: ubuntu-22.04
    # Assumes the portfolio-github-deploy role (infra/github-oidc.tf) through GitHub's OIDC token,
    # instead of long-lived access keys; only workflows on main can assume it.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install node modules
        run: npm ci
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
      - name: Build webapp
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # sync --delete replaces the old rm-then-copy, so the site is never briefly empty.
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist/ "$AWS_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
    env:
      AWS_BUCKET: ${{ vars.AWS_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
