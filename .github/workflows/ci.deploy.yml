name: BatesPortfolio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
      - name: Run build and tests for PRs
        run: |
          npm ci
          npm run test:run
          npm run build
  deployment:
    # Pushes to main only: the role below trusts main and nothing else, and pull requests must
    # never deploy to production.
    if: ${{ github.event_name == 'push' && github.actor != 'dependabot[bot]' }}
    name: Deploy to S3
    needs: [build]
    # One deploy at a time, queued rather than cancelled: an older run's sync --delete finishing
    # after a newer one would leave the site stale.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    # Assumes portfolio-github-deploy (bates-solutions monorepo, infra/personal) through GitHub's
    # OIDC token instead of long-lived access keys.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install node modules
        run: npm ci
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
      - name: Build webapp
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Vite's hashed files in assets/ never change, so browsers keep them for a year; everything
      # else revalidates on every request. New assets go up first, then the pages that use them,
      # then old assets are removed, so the site is never briefly broken or empty.
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist/assets "$AWS_BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./dist/ "$AWS_BUCKET" --delete --exclude "assets/*" --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync ./dist/assets "$AWS_BUCKET/assets" --delete --cache-control "public, max-age=31536000, immutable"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
    env:
      AWS_BUCKET: ${{ vars.AWS_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
